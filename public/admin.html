<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6feb">
  <title>QuickCash Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="/"><span class="brand-mark">₹</span>QuickCash <span class="muted small-text">Admin</span></a>
      <nav><a href="#" id="logout" class="link hidden" style="display:inline-block">Log out</a></nav>
    </div>
  </header>

  <main>
    <section class="card" id="login">
      <h2>Admin login</h2>
      <form id="login-form">
        <label for="token">Admin token</label>
        <input id="token" type="password" required autocomplete="current-password">
        <div class="field-error" id="login-error"></div>
        <div class="actions"><button type="submit">Log in</button></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="list-header">
          <h2>Applications</h2>
          <select id="status-filter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option>PENDING</option>
            <option>APPROVED</option>
            <option>DISBURSED</option>
            <option>CLOSED</option>
            <option>REJECTED</option>
          </select>
        </div>
        <div>
          <table class="apps">
            <thead>
              <tr>
                <th>Reference</th><th>Applicant</th><th>Income</th>
                <th>Loan</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
