<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6feb">
  <meta name="robots" content="noindex">
  <title>QuickCash Admin</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site">
    <div class="inner admin-inner">
      <a class="brand" href="/admin"><span class="brand-mark">₹</span>QuickCash <span class="muted small-text">Admin</span></a>
      <nav><a href="#" id="logout" class="link hidden" style="display:inline-block">Log out</a></nav>
    </div>
  </header>

  <main class="admin-main">
    <section class="card" id="login" style="max-width:420px;margin:40px auto">
      <h2>Admin login</h2>
      <form id="login-form">
        <label for="token">Admin token</label>
        <input id="token" type="password" required autocomplete="current-password">
        <div class="field-error" id="login-error"></div>
        <div class="actions"><button type="submit">Log in</button></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="list-header">
          <h2>Applications</h2>
          <div class="filters">
            <input id="search" type="search" placeholder="Search name, mobile, PAN, ref…" aria-label="Search">
            <select id="status-filter" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="PENDING">Pending review</option>
              <option value="APPROVED">Approved – to disburse</option>
              <option value="DISBURSED">Active loans</option>
              <option value="CLOSED">Closed</option>
              <option value="REJECTED">Rejected</option>
            </select>
          </div>
        </div>
        <table class="apps">
          <thead>
            <tr>
              <th>Reference</th><th>Applicant</th><th>Income</th>
              <th>Loan</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="drawer-backdrop hidden" id="backdrop"></div>
  <aside class="drawer hidden" id="drawer" aria-modal="true" role="dialog" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <button class="icon-btn" id="drawer-close" aria-label="Close">×</button>
      <h2 id="drawer-title">Application</h2>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
